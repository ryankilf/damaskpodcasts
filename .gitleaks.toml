# Secret scanning (CI: .github/workflows/security.yml; locally: sh .github/scripts/secret-scan.sh).
# Starts from the scanner's default rules. Every allow-list entry says why it isn't a secret.
[extend]
useDefault = true

[allowlist]
description = "Known non-secrets"
paths = [
  # Build output, Gradle caches and local-only files.
  '''(^|/)build/''',
  '''(^|/)\.gradle/''',
  '''(^|/)\.kotlin/''',
  '''(^|/)\.idea/''',
  '''(^|/)local\.properties$''',
  '''(^|/)llm-scrapbook/''',
  # Throwaway values for the old local docker compose stack (search backend, now only in history
  # and on the backend branch). Never valid for any server.
  '''(^|/)deploy/local\.env$''',
]
# The local stack's private token, quoted in curl examples. Not valid anywhere but localhost.
regexes = ['''local-dev-private-token''']
