<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini-player</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<style>
body{margin:0}
</style>
</helmet>
<div style="background: var(--surface-container-high); overflow: hidden; font-family: var(--font-sans); color: var(--on-surface)">
  <a href="NowPlaying.dc.html" aria-label="Open Now Playing: {{it.title}}" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 4px 0 16px; color: inherit; text-decoration: none">
    <div aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #ffffff; background: {{it.art}}">{{it.initials}}</div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <div class="t-label clamp1">{{it.title}}</div>
      <div class="t-body-sm clamp1" style="color: var(--on-surface-variant)">{{it.show}}</div>
      <div aria-hidden="true" style="height: 3px; margin-top: 4px; border-radius: var(--radius-full); background: var(--outline-variant); overflow: hidden">
        <div style="height: 3px; border-radius: var(--radius-full); background: var(--primary); width: {{it.pct}}%"></div>
      </div>
    </div>
    <span aria-hidden="true" style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--on-surface)"><span class="ms fill">pause</span></span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null,"tsType":"{art:string,initials:string,title:string,show:string,pct:number}"},"$preview":{"width":390,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    return { it: this.props.item ?? { art: '#6b3f2a', initials: 'LI', title: 'The Siege of Derry, part 2', show: 'Ledger & Ink', pct: 41 } };
  }
}
</script>
</body>
</html>
