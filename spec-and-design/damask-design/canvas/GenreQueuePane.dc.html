<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Genre queue pane</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 16px; font-family: var(--font-sans); color: var(--on-surface)">
  <header style="min-height: 64px; display: flex; align-items: center; gap: 4px; padding: 8px 4px 0">
    <sc-if value="{{compact}}" hint-placeholder-val="{{true}}">
      <a href="Genres.dc.html" aria-label="Back to Genres" style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--on-surface); text-decoration: none"><span class="ms" aria-hidden="true">arrow_back</span></a>
    </sc-if>
    <div style="flex: 1; min-width: 0; padding-left: 12px">
      <h1 class="t-title-lg" style="margin: 0">History</h1>
      <span class="t-body-sm" title="Last played Thu 27 Nov 2026, 08:12 · 4 shows" style="color: var(--on-surface-variant)">Last played today · 4 shows</span>
    </div>
    <button type="button" aria-label="Genre options" style="width: 48px; height: 48px; border: none; background: transparent; border-radius: var(--radius-full); color: var(--on-surface-variant); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">more_vert</span></button>
  </header>
  <section aria-labelledby="gip" style="margin: 0 12px; padding: 8px 0; border-radius: var(--radius-md); background: var(--primary-container)">
    <h2 id="gip" class="t-title" style="margin: 0; padding: 8px 16px 4px; color: var(--on-primary-container)">In progress</h2>
    <dc-import name="EpisodeRow" item="{{derry}}" hint-size="100%,88px"></dc-import>
  </section>
  <section aria-labelledby="gq" style="display: flex; flex-direction: column; margin: 0 12px">
    <h2 id="gq" class="t-title" style="margin: 0; padding: 0 16px 4px">Up next</h2>
    <sc-for list="{{queue}}" as="ep" hint-placeholder-count="4">
      <dc-import name="EpisodeRow" item="{{ep}}" hint-size="100%,88px"></dc-import>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"compact":{"editor":"boolean","default":true},"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      compact: this.props.compact ?? true,
      derry: { art: '#6b3f2a', initials: 'LI', title: 'The Siege of Derry, part 2', show: 'Ledger & Ink', meta: '32 min left', metaExact: '32:04 left of 54:10 (41%) · last played today, 08:12', pct: 41, hasProgress: true, hasGenre: false },
      queue: [
        { art: '#8a6a2f', initials: 'FN', title: 'The winter of 1947', show: 'Fieldnotes', meta: '55 min · Mon', metaExact: '55:02 · published Mon 24 Nov 2026 · show last played Fri 31 Oct 2026', hasProgress: false, hasGenre: false },
        { art: '#3a5c4f', initials: 'MR', title: 'Drawing the plantation', show: 'The Map Room', meta: 'Ep 3 of 12 · 38 min', metaExact: '38:20 · serial, oldest unplayed first · show last played Sun 9 Nov 2026', hasProgress: false, hasGenre: false },
        { art: '#6b5a3f', initials: 'ED', title: 'Salt and the Hanseatic League', show: 'Empires of Dust', meta: '1 hr 4 min · 19 Nov', metaExact: '1:04:12 · published Wed 19 Nov 2026 · show last played Mon 17 Nov 2026', hasProgress: false, hasGenre: false },
        { art: '#6b3f2a', initials: 'LI', title: 'The Siege of Derry, part 3', show: 'Ledger & Ink', meta: '47 min · Today', metaExact: '47:30 · published Thu 27 Nov 2026 · show last played today, 08:12', hasProgress: false, hasGenre: false }
      ]
    };
  }
}
</script>
</body>
</html>
