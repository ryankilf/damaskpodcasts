<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Damask logo: Folded corner</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 720px; height: 480px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: var(--surface); color: var(--on-surface); font-family: var(--font-sans)">
  <div style="display: flex; flex-direction: column; gap: 4px; max-width: 560px">
    <h2 class="t-title-lg" style="margin: 0">Folded corner</h2>
    <p class="t-body-sm" style="margin: 0; color: var(--on-surface-variant)">A sheet of damask with its corner turned down: your place kept. Calm, simple, reads at any size.</p>
  </div>
  <div style="display: flex; gap: 40px; align-items: flex-start">
    <div style="width: 200px; height: 200px; border-radius: 48px; overflow: hidden; background: #006a63; color: #ffffff; --acc: #c0ebe5; --tile: #006a63; flex: none"><svg viewBox="0 0 108 108" width="200" height="200" aria-hidden="true"><path d="M36 30 H62 L78 46 V72 Q78 78 72 78 H36 Q30 78 30 72 V36 Q30 30 36 30 Z" fill="currentColor"></path><path d="M62 30 V40 Q62 46 68 46 H78 Z" style="fill: var(--acc)"></path></svg></div>
    <div style="display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; gap: 16px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 88px"><div style="width: 72px; height: 72px; border-radius: 18px; overflow: hidden; background: #006a63; color: #ffffff; --acc: #c0ebe5; --tile: #006a63; flex: none"><svg viewBox="0 0 108 108" width="72" height="72" aria-hidden="true"><path d="M36 30 H62 L78 46 V72 Q78 78 72 78 H36 Q30 78 30 72 V36 Q30 30 36 30 Z" fill="currentColor"></path><path d="M62 30 V40 Q62 46 68 46 H78 Z" style="fill: var(--acc)"></path></svg></div><span class="t-label" style="color: var(--on-surface-variant); text-align: center">Full colour</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 88px"><div style="width: 72px; height: 72px; border-radius: 18px; overflow: hidden; background: var(--primary-container); color: var(--on-primary-container); --acc: var(--on-primary-container); --tile: var(--primary-container); flex: none"><svg viewBox="0 0 108 108" width="72" height="72" aria-hidden="true"><path d="M36 30 H62 L78 46 V72 Q78 78 72 78 H36 Q30 78 30 72 V36 Q30 30 36 30 Z" fill="currentColor"></path><path d="M62 30 V40 Q62 46 68 46 H78 Z" style="fill: var(--acc)"></path></svg></div><span class="t-label" style="color: var(--on-surface-variant); text-align: center">Themed (Material You)</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 88px"><div style="width: 72px; height: 72px; border-radius: 18px; overflow: hidden; background: #0e1514; color: #51dbce; --acc: #c0ebe5; --tile: #0e1514; flex: none"><svg viewBox="0 0 108 108" width="72" height="72" aria-hidden="true"><path d="M36 30 H62 L78 46 V72 Q78 78 72 78 H36 Q30 78 30 72 V36 Q30 30 36 30 Z" fill="currentColor"></path><path d="M62 30 V40 Q62 46 68 46 H78 Z" style="fill: var(--acc)"></path></svg></div><span class="t-label" style="color: var(--on-surface-variant); text-align: center">Dark</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; color: var(--primary); --acc: var(--tertiary); --tile: var(--surface)">
        <svg viewBox="0 0 108 108" width="64" height="64" aria-hidden="true"><path d="M36 30 H62 L78 46 V72 Q78 78 72 78 H36 Q30 78 30 72 V36 Q30 30 36 30 Z" fill="currentColor"></path><path d="M62 30 V40 Q62 46 68 46 H78 Z" style="fill: var(--acc)"></path></svg>
        <span style="font-size: 52px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; color: var(--on-surface)">Damask</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","blue-light","blue-dark","green-light","green-dark"],"default":"light"},"$preview":{"width":720,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
