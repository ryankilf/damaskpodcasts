<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--on-surface); font-family: var(--font-sans); overflow: hidden">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 16px">
    <h1 class="t-title-lg" style="margin: 0; flex: 1">Home</h1>
    <a href="Appearance.dc.html" aria-label="Settings" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--on-surface-variant); text-decoration: none"><span class="ms" aria-hidden="true">settings</span></a>
  </header>
  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 24px; padding-bottom: 16px">
    <section aria-labelledby="ip" style="margin: 0 12px; padding: 8px 0; border-radius: var(--radius-md); background: var(--primary-container)">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px">
        <h2 id="ip" class="t-title" style="margin: 0; color: var(--on-primary-container)">In progress</h2>
        <span class="t-body-sm" style="flex: 1; color: var(--on-primary-container)">{{inProgressCount}}</span>
      </div>
      <sc-for list="{{inProgress}}" as="ep" hint-placeholder-count="3">
        <dc-import name="EpisodeRow" item="{{ep}}" hint-size="100%,88px"></dc-import>
      </sc-for>
      <button type="button" class="t-label" style="display: flex; align-items: center; gap: 4px; width: fit-content; min-height: 44px; margin: 4px 4px 0 auto; padding: 0 8px 0 12px; border: none; border-radius: var(--radius-full); background: transparent; color: var(--on-primary-container); cursor: pointer">See all {{inProgressCount}}<span class="ms" aria-hidden="true">chevron_right</span></button>
    </section>
    <section aria-labelledby="un" style="display: flex; flex-direction: column; margin: 0 12px">
      <h2 id="un" class="t-title" style="margin: 0; padding: 0 16px 4px">Up next</h2>
      <sc-for list="{{upNext}}" as="ep" hint-placeholder-count="4">
        <dc-import name="EpisodeRow" item="{{ep}}" hint-size="100%,104px"></dc-import>
      </sc-for>
    </section>
  </main>
  <dc-import name="MiniPlayer" item="{{nowPlaying}}" hint-size="100%,72px"></dc-import>
  <dc-import name="NavBar" active="home" hint-size="100%,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","blue-light","blue-dark","green-light","green-dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      inProgress: [
        { art: '#6b3f2a', initials: 'LI', title: 'The Siege of Derry, part 2', show: 'Ledger & Ink', meta: 'Playing · 32 min left', metaExact: '32:04 left of 54:10 (41%) · playing now', pct: 41, hasProgress: true, playing: true, hasGenre: false },
        { art: '#2d5d7b', initials: 'QO', title: 'Why bridges hum', show: 'Quiet Orbit', meta: '12 min left', metaExact: '11:48 left of 52:30 (78%) · last played Tue 25 Nov 2026, 19:40', pct: 78, hasProgress: true, hasGenre: false },
        { art: '#8a6a2f', initials: 'FN', title: 'The Flight of the Earls', show: 'Fieldnotes', meta: '6 min left', metaExact: '5:52 left of 48:20 (88%) · last played Sun 23 Nov 2026, 21:05', pct: 88, hasProgress: true, hasGenre: false }

}
</script>
</body>
</html>
