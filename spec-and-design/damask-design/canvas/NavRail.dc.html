<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation rail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 80px; height: 100%; min-height: 800px; box-sizing: border-box; padding: 24px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; background: var(--surface); font-family: var(--font-sans)">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
    <a href="{{t.href}}" aria-current="{{t.current}}" style="width: 80px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; text-decoration: none; color: {{t.col}}">
      <span style="width: 56px; height: 32px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: {{t.ind}}; color: {{t.iconCol}}"><span class="ms {{t.fill}}" aria-hidden="true">{{t.icon}}</span></span>
      <span class="t-label">{{t.label}}</span>
    </a>
  </sc-for>
  <div style="flex: 1"></div>
  <a href="Appearance.dc.html" aria-label="Settings" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--on-surface-variant); text-decoration: none"><span class="ms" aria-hidden="true">settings</span></a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","genres","history","search"],"default":"home"},"$preview":{"width":80,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const defs = [
      { id: 'home', label: 'Home', icon: 'home', href: 'TabletHome.dc.html' },
      { id: 'genres', label: 'Genres', icon: 'category', href: 'TabletGenres.dc.html' },
      { id: 'history', label: 'Played', icon: 'history', href: 'History.dc.html' },
      { id: 'search', label: 'Search', icon: 'search', href: 'Search.dc.html' }
    ];
    const tabs = defs.map((d) => {
      const on = d.id === active;
      return { ...d, current: on ? 'page' : 'false', fill: on ? 'fill' : '', ind: on ? 'var(--secondary-container)' : 'transparent', iconCol: on ? 'var(--on-secondary-container)' : 'var(--on-surface-variant)', col: on ? 'var(--on-surface)' : 'var(--on-surface-variant)' };
    });
    return { tabs };
  }
}
</script>
</body>
</html>
