<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Episode row</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; min-height: 72px; box-sizing: border-box; font-family: var(--font-sans); color: var(--on-surface)">
  <div aria-hidden="true" style="width: 56px; height: 56px; flex: none; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #ffffff; background: {{it.art}}">{{it.initials}}</div>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
    <sc-if value="{{it.hasGenre}}" hint-placeholder-val="{{true}}">
      <span class="t-label" style="align-self: flex-start; padding: 2px 8px; border-radius: var(--radius-full); background: var(--tertiary-container); color: var(--on-tertiary-container)">{{it.genre}}</span>
    </sc-if>
    <div class="t-title clamp2">{{it.title}}</div>
    <div class="t-body-sm clamp1" title="{{it.metaExact}}" style="color: var(--on-surface-variant)">{{it.show}} · <span class="t-time">{{it.meta}}</span></div>
  </div>
  <sc-if value="{{playing}}" hint-placeholder-val="{{false}}">
    <div style="position: relative; width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: var(--radius-full); background: conic-gradient(var(--primary) {{it.pct}}%, var(--outline-variant) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px))"></div>
      <button type="button" aria-label="Pause {{it.title}}, {{it.metaExact}}" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer"><span class="damask-fill" style="width: 36px; height: 36px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary); --damask-pitch: 9px"><span class="ms fill" aria-hidden="true">pause</span></span></button>
    </div>
  </sc-if>
  <sc-if value="{{resumable}}" hint-placeholder-val="{{true}}">
    <div style="position: relative; width: 48px; height: 48px; flex: none">
      <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: var(--radius-full); background: conic-gradient(var(--primary) {{it.pct}}%, var(--outline-variant) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px))"></div>
      <button type="button" aria-label="Resume {{it.title}}, {{it.metaExact}}" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: transparent; color: var(--on-surface); cursor: pointer"><span class="ms" aria-hidden="true">play_arrow</span></button>
    </div>
  </sc-if>
  <sc-if value="{{notStarted}}" hint-placeholder-val="{{false}}">
    <div style="position: relative; width: 48px; height: 48px; flex: none">
      <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: var(--radius-full); background: var(--outline-variant); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px))"></div>
      <button type="button" aria-label="Play {{it.title}}" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: transparent; color: var(--on-surface); cursor: pointer"><span class="ms" aria-hidden="true">play_arrow</span></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null,"tsType":"{art:string,initials:string,title:string,show:string,meta:string,metaExact:string,pct?:number,hasProgress:boolean,playing?:boolean,genre?:string,hasGenre:boolean}"},"$preview":{"width":390,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item ?? { art: '#6b3f2a', initials: 'LI', title: 'The Siege of Derry, part 2', show: 'Ledger & Ink', meta: '32 min left', metaExact: '32:04 left of 54:10 (41%)', pct: 41, hasProgress: true, genre: 'History', hasGenre: true };
    return { it, notStarted: !it.hasProgress, playing: !!it.playing, resumable: !!it.hasProgress && !it.playing };
  }
}
</script>
</body>
</html>
