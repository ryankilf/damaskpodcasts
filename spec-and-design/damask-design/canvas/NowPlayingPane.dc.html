<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing pane</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<style>
body{margin:0}
</style>
</helmet>
<div style="height: 100%; min-height: 760px; box-sizing: border-box; display: flex; flex-direction: column; padding: 8px 24px 24px; font-family: var(--font-sans); color: var(--on-surface)">
  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; margin: 0 -12px">
    <sc-if value="{{compact}}" hint-placeholder-val="{{true}}">
      <a href="Main.dc.html" aria-label="Collapse" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--on-surface-variant); text-decoration: none"><span class="ms" aria-hidden="true">keyboard_arrow_down</span></a>
    </sc-if>
    <sc-if value="{{wide}}" hint-placeholder-val="{{false}}">
      <span class="t-label" style="padding-left: 12px; color: var(--on-surface-variant)">Now playing</span>
    </sc-if>
    <button type="button" aria-label="More options" style="width: 48px; height: 48px; border: none; background: transparent; border-radius: var(--radius-full); color: var(--on-surface-variant); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">more_vert</span></button>
  </div>
  <div style="flex: 1 1 0; min-height: 160px; margin-top: 8px; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; height: 100%; max-height: 340px; max-width: 100%; aspect-ratio: 1 / 1">
      <sc-if value="{{ambient}}" hint-placeholder-val="{{true}}">
        <div aria-hidden="true" style="position: absolute; inset: -40px; border-radius: 56px; background: radial-gradient(closest-side, #6b3f2a 60%, rgba(107, 63, 42, 0.6) 82%, rgba(107, 63, 42, 0) 100%); filter: blur(40px); opacity: 0.9"></div>
      </sc-if>
      <div aria-hidden="true" style="position: relative; width: 100%; height: 100%; border-radius: var(--radius-md); background: #6b3f2a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 700">LI</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 24px">
    <span class="t-label" style="align-self: flex-start; padding: 2px 8px; border-radius: var(--radius-full); background: var(--tertiary-container); color: var(--on-tertiary-container)">History</span>
    <h2 class="t-title-lg" style="margin: 0">The Siege of Derry, part 2</h2>
    <a href="GenreQueue.dc.html" class="t-body" style="color: var(--on-surface-variant); text-decoration: none">Ledger &amp; Ink</a>
  </div>
  <div style="margin-top: 20px">
    <div role="slider" aria-label="Position" aria-valuetext="22:06 of 54:10, 41%" aria-valuenow="41" aria-valuemin="0" aria-valuemax="100" tabindex="0" style="position: relative; height: 20px; display: flex; align-items: center">
      <div style="width: 100%; height: 4px; border-radius: var(--radius-full); background: var(--surface-container-highest)"></div>
      <div style="position: absolute; left: 0; width: 41%; height: 4px; border-radius: var(--radius-full); background: var(--primary)"></div>
      <div style="position: absolute; left: 41%; width: 4px; height: 20px; margin-left: -2px; border-radius: var(--radius-full); background: var(--primary)"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 4px">
      <span class="t-time" title="22:06 played of 54:10" style="color: var(--on-surface-variant)">22:06</span>
      <span class="t-time" title="32:04 left of 54:10 (41% played)" style="color: var(--on-surface-variant)">−32:04</span>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; margin: 12px -8px 0">
    <button type="button" class="t-label" aria-label="Playback speed 1.2 times" style="width: 48px; height: 48px; padding: 0; border: none; border-radius: var(--radius-full); background: transparent; color: var(--on-surface-variant); display: flex; align-items: center; justify-content: center">1.2×</button>
    <button type="button" aria-label="Back 10 seconds" style="width: 56px; height: 56px; border: none; background: transparent; border-radius: var(--radius-full); color: var(--on-surface); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 32px">replay_10</span></button>
    <button type="button" class="damask-fill" aria-label="Pause" style="width: 80px; height: 80px; border: none; border-radius: var(--radius-full); --damask-pitch: 14px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center"><span class="ms fill" aria-hidden="true" style="font-size: 40px">pause</span></button>
    <button type="button" aria-label="Forward 30 seconds" style="width: 56px; height: 56px; border: none; background: transparent; border-radius: var(--radius-full); color: var(--on-surface); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 32px">forward_30</span></button>
    <button type="button" aria-label="Mark as played" style="width: 48px; height: 48px; padding: 0; border: none; border-radius: var(--radius-full); background: transparent; color: var(--on-surface-variant); display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">check_circle</span></button>
  </div>
  <a href="NowPlayingNotes.dc.html" aria-label="Open show notes" style="display: block; margin: 24px -24px -24px; padding: 12px 24px 20px; border-radius: 28px 28px 0 0; background: var(--surface-container-low); color: inherit; text-decoration: none">
    <div aria-hidden="true" style="width: 32px; height: 4px; margin: 0 auto 12px; border-radius: var(--radius-full); background: var(--outline-variant)"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="t-title">Show notes</span>
      <span class="ms" aria-hidden="true" style="color: var(--on-surface-variant)">expand_less</span>
    </div>
    <div class="t-body-sm clamp1" style="margin-top: 2px; color: var(--on-surface-variant)">The gates are shut, the boom is across the Foyle, and the city settles in to wait.</div>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"compact":{"editor":"boolean","default":true},"ambient":{"editor":"boolean","default":true},"$preview":{"width":420,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const compact = this.props.compact ?? true;
    return { compact, wide: !compact, ambient: this.props.ambient ?? true };
  }
}
</script>
</body>
</html>
