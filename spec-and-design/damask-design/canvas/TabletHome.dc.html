<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, expanded</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 1280px; height: 800px; display: flex; background: var(--surface); color: var(--on-surface); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="NavRail" active="home" hint-size="80px,800px"></dc-import>
  <div style="width: 440px; flex: none; display: flex; flex-direction: column; overflow: hidden">
    <header style="height: 64px; flex: none; display: flex; align-items: center; padding: 0 16px">
      <h1 class="t-title-lg" style="margin: 0">Home</h1>
    </header>
    <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 24px">
      <section aria-labelledby="ip" style="margin: 0 12px; padding: 8px 0; border-radius: var(--radius-md); background: var(--primary-container)">
        <div style="display: flex; align-items: baseline; gap: 8px; padding: 8px 16px 4px">
          <h2 id="ip" class="t-title" style="margin: 0; color: var(--on-primary-container)">In progress</h2>
          <span class="t-body-sm" style="color: var(--on-primary-container)">2</span>
        </div>
        <sc-for list="{{inProgress}}" as="ep" hint-placeholder-count="2">
          <dc-import name="EpisodeRow" item="{{ep}}" hint-size="100%,88px"></dc-import>
        </sc-for>
      </section>
      <section aria-labelledby="un" style="display: flex; flex-direction: column">
        <h2 id="un" class="t-title" style="margin: 0; padding: 0 16px 4px">Up next</h2>
        <sc-for list="{{upNext}}" as="ep" hint-placeholder-count="4">
          <dc-import name="EpisodeRow" item="{{ep}}" hint-size="100%,104px"></dc-import>
        </sc-for>
      </section>
    </main>
  </div>
  <section aria-label="Now playing" style="flex: 1; min-width: 0; margin: 16px 16px 16px 8px; border-radius: var(--radius-md); background: var(--surface-container-low); display: flex; justify-content: center; overflow: hidden">
    <div style="width: 100%; max-width: 520px">
      <dc-import name="NowPlayingPane" compact="{{no}}" hint-size="100%,768px"></dc-import>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","blue-light","blue-dark","green-light","green-dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      no: false,
      inProgress: [
        { art: '#6b3f2a', initials: 'LI', title: 'The Siege of Derry, part 2', show: 'Ledger & Ink', meta: '32 min left', metaExact: '32:04 left of 54:10 (41%) · last played today, 08:12', pct: 41, hasProgress: true, hasGenre: false },
        { art: '#2d5d7b', initials: 'QO', title: 'Why bridges hum', show: 'Quiet Orbit', meta: '12 min left', metaExact: '11:48 left of 52:30 (78%) · last played Tue 25 Nov 2026, 19:40', pct: 78, hasProgress: true, hasGenre: false }
      ],
      upNext: [
        { art: '#3f6b4a', initials: 'HL', genre: 'Science', hasGenre: true, title: 'The octopus that edits its own RNA', show: 'Half-Life FM', meta: '48 min · Tue', metaExact: '47:52 · published Tue 25 Nov 2026', hasProgress: false },
        { art: '#7a4b6e', initials: 'PS', genre: 'Comedy', hasGenre: true, title: 'The parish council minutes', show: 'Petty Sessions', meta: '41 min · 12 Nov', metaExact: '41:07 · published Wed 12 Nov 2026', hasProgress: false },
        { art: '#55586b', initials: 'NS', genre: 'Society & Culture', hasGenre: true, title: 'Who still writes cheques?', show: 'Northern Signal', meta: '29 min · Today', metaExact: '29:15 · published Thu 27 Nov 2026, 06:00', hasProgress: false },
        { art: '#2f5a6b', initials: 'PL', genre: 'Technology', hasGenre: true, title: 'Why your router hates you', show: 'Packet Loss', meta: '36 min · Mon', metaExact: '36:12 · published Mon 24 Nov 2026', hasProgress: false },
        { art: '#6b2f3a', initials: 'MD', genre: 'News', hasGenre: true, title: 'Thursday 27 November', show: 'Morning Dispatch', meta: '18 min · Today', metaExact: '18:05 · published Thu 27 Nov 2026, 06:30', hasProgress: false },
        { art: '#8a6a2f', initials: 'FN', genre: 'History', hasGenre: true, title: 'The winter of 1947', show: 'Fieldnotes', meta: '55 min · Mon', metaExact: '55:02 · published Mon 24 Nov 2026', hasProgress: false }
      ]
    };
  }
}
</script>
</body>
</html>
