<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Damask</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--on-surface); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--primary); }
  .tint { fill:var(--primary-container); }
  .deep { fill:var(--on-surface); }
  .cat { fill:var(--tertiary); }
  .blk { rx:var(--radius-md); }
  .track { fill:none; stroke:var(--surface-container-highest); stroke-width:var(--space-2); stroke-linecap:round; }
  .fill { fill:none; stroke:var(--primary); stroke-width:var(--space-2); stroke-linecap:round; }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:700; letter-spacing:-.03em; color:var(--on-surface); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--on-surface-variant); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 144x240 slab bled off the top (unfinished, the loudest role) · on-surface 320x216 bleeding off the right · primary-container 144x48 bled off the top · tertiary 96x64 bled off the bottom (it only marks genres) — about 40% of 960x288
  arrangement one tall progress slab with satellites, space-4 gutters, blocks bleeding top, right and bottom
  pattern     progress arcs, from "Unfinished is the loudest thing on screen": three quarter-circle tracks in surface-container-highest on the on-surface block, each part-filled in primary like a progress bar bent round
  scales      sides in space-2 multiples; gutters space-4; arc stroke space-2 with radius-full caps; corners radius-md
-->
<rect class="brand blk" x="16" y="-16" width="144" height="240" rx="16"/>
<rect class="cat blk" x="16" y="240" width="96" height="64" rx="16"/>
<rect class="tint blk" x="176" y="-16" width="144" height="48" rx="16"/>
<rect class="deep blk" x="176" y="48" width="320" height="216" rx="16"/>
<path class="track" d="M256 232 A48 48 0 0 0 208 184"/>
<path class="track" d="M304 232 A96 96 0 0 0 208 136"/>
<path class="track" d="M352 232 A144 144 0 0 0 208 88"/>
<path class="fill" d="M256 232 A48 48 0 0 0 219.2 185.3"/>
<path class="fill" d="M304 232 A96 96 0 0 0 270.3 159"/>
<path class="fill" d="M352 232 A144 144 0 0 0 341 176.9"/>
</svg>
</div>
<div class="words">
<h1 class="name">Damask</h1>
<p class="tag">Unfinished first, then whatever you've neglected longest.</p>
</div>
</div>
</body>
</html>
