# Secret scanning on every push and pull request, over the full history, so a key committed and
# later deleted is still caught. Allow-list (with reasons) in .gitleaks.toml.
name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history and working tree
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml --exit-code 1
