# The app: shared/core, presentation, ui, the Android and desktop apps, and the lint rules.
# Runs on Linux, so iOS (Kotlin/Native for Apple) targets are skipped; run them locally on a Mac.
name: App

on:
  push:
    branches: [main, backend]
    paths-ignore:
      - "server/**"
      - "deploy/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/server.yml"
      - ".github/workflows/security.yml"
  pull_request:
    paths-ignore:
      - "server/**"
      - "deploy/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/server.yml"
      - ".github/workflows/security.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (JVM and Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Gradle check
        # Everything except the server modules (their own workflow), with iOS targets disabled on Linux.
        run: >
          ./gradlew --continue -Pkotlin.native.ignoreDisabledTargets=true
          check
          -x :server:meili:check -x :server:search:check -x :server:importer:check
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
