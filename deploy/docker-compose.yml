# Damask search on one VPS (spec › Search). Production:
#   cd deploy && ./build.sh && docker compose --env-file .env --profile public up -d
# Local, against the fixture index (no TLS, no Caddy):
#   cd deploy && ./build.sh && docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Only Caddy publishes ports (80/443). Meilisearch and the gateway are reachable only on the
# private compose network.

name: damask-search

services:
  meilisearch:
    image: getmeili/meilisearch:v1.58.0
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      # Caps indexing memory so the weekly import can't starve the gateway.
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-1Gb}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-1}
    volumes:
      - meili_data:/meili_data
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    image: damask-gateway:local
    restart: unless-stopped
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_SEARCH_KEY: ${MEILI_SEARCH_KEY:?set MEILI_SEARCH_KEY - run ./search-key.sh}
      SUPABASE_URL: ${SUPABASE_URL:-}
      PRIVATE_TOKEN: ${PRIVATE_TOKEN:-}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      PI_PASSTHROUGH: ${PI_PASSTHROUGH:-false}
      PI_KEY: ${PI_KEY:-}
      PI_SECRET: ${PI_SECRET:-}
      REGION_BOOST: ${REGION_BOOST:-1.25}
      DAMASK_VERSION: ${DAMASK_VERSION:-dev}
    depends_on:
      meilisearch:
        condition: service_healthy
    networks: [backend]

  # One-shot: `docker compose --profile import run --rm importer` (the systemd timer does this weekly).
  importer:
    build:
      context: ..
      dockerfile: deploy/importer.Dockerfile
    image: damask-importer:local
    profiles: [import]
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_SEARCH_KEY_UID: ${MEILI_SEARCH_KEY_UID:?set MEILI_SEARCH_KEY_UID}
      RANK_HALF_LIFE_DAYS: ${RANK_HALF_LIFE_DAYS:-365}
      RANK_FRESHNESS_FLOOR: ${RANK_FRESHNESS_FLOOR:-0.4}
      RANK_POPULARITY_PRIOR: ${RANK_POPULARITY_PRIOR:-1}
      RANK_APPLE_LISTED_BOOST: ${RANK_APPLE_LISTED_BOOST:-1.5}
      RANK_FEED_AGE_BOOST: ${RANK_FEED_AGE_BOOST:-0.1}
      RANK_FEED_AGE_FULL_YEARS: ${RANK_FEED_AGE_FULL_YEARS:-5}
      RANK_STEP: ${RANK_STEP:-0}
      DAMASK_VERSION: ${DAMASK_VERSION:-dev}
    volumes:
      - import_work:/work
    depends_on:
      meilisearch:
        condition: service_healthy
    networks: [backend]

  # Ingress: TLS termination and the only published ports. Swappable for another reverse proxy.
  caddy:
    image: caddy:2.11.9-alpine
    profiles: [public]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    networks: [backend]

volumes:
  meili_data:
  import_work:
  caddy_data:
  caddy_config:

networks:
  backend:
